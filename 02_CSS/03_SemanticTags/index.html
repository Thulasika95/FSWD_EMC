<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smantic Tags</title>
    <style>
        header,
        main,
        section,
        article,
        footer {
            background-color: brown;
            width: 90%;

            margin: 10px;
            padding: 20px;
            /*applies all the 4 sides as same */
            border: 2px solid black;
        }

        .section {
            height: 190px;
            background-color: lightcoral;
        }

        section article {
            width: 85%;
            height: 2px;
            background-color: lightsalmon;
        }
    </style>
</head>

<body>

        </section>
        <section class="section">
            <article></article>

            <article></article>
        </section>
        <section class="section">
            <article></article>
            <article></article>
            <article></article>
        </section>
    </main>
    <footer></footer>
</body>

</html>
