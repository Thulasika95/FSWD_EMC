<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>
    <style>
        #red{
            color: red;
        }

        .blue{
            color: blue;
        }

        h1{
            color: green !important;
        }
    </style>
</head>
<body>
    <h1>Thulasi</h1>
    <h1 id="red">Thulasi</h1>
    <h1 class="blue">Thulasi</h1>
    <h1>Thulasi</h1>
    <h1 class="blue">Thulasi</h1>
    types of selector
</body>
</html>
