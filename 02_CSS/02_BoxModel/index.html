<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        * {
            margin: 0;
        }

        div {
            background-color: brown;
            width: 20%;

            margin: 100px 0 0 300px; /*apply 4 sides with unique values top=100px, right=0, bottom=0, left=300px*/
            padding: 10px; /*applies all the 4 sides as same */
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div>
        Thulasika
    </div>
</body>
</html>
