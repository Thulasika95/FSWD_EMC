<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
    <style>
        body {
            border: 5px solid black;
            height: 100vh;
        }
        .item {
            background-color: coral;
            padding: 10px;
            border: 1px solid black;
        }

        .static {
            position: static;
            top: 10px;
        }

        .relative {
            position: relatiove;
            top: 100px;
        }

        .fixed {
            position: fixed;
            bottom: 0;
        }
    </style>
</head>
<body>
    <div class="static item">Static</div>
    <div class="relative item">Relative</div>
    <div class="absolute item">Absolute</div>
    <div class="Fixed item">Fixed</div>
</body>
</html>
