<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Layout</title>
    <style>
        .container {
            border: 1px solid black;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;

        }

        .item {
            background-color: brown;
            border: 1px solid black;
        }

        .item-1 {
            grid-row: 1/4;
        }

        .item-2 {
            grid-column: 2/4;
        }

        .item-5 {
            grid-column: 3/5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item-1 item">item</div>
        <div class="item-2 item">item</div>
        <div class="item-3 item">item</div>
        <div class="item-4 item">item</div>
        <div class="item-5 item">item</div>
    </div>
</body>
</html>
