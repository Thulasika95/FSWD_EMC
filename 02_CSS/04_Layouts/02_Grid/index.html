<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        .container {
            display: grid;
            gap: 10px;
            /* grid-template-columns: repeat(3, 1fr); */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /*its allocate according to screen width*/
            /* grid-template-columns: 1fr 1fr 1fr; */

            /* grid-template-rows: repeat(3, 1fr); */
            grid-auto-rows: 1fr; /*this will allocated each rows to 1fr*/

            height: 80vh;

            /* justify-items: center;
            align-items: center; */
        }

        .item {
            background-color: coral;
            padding: 10px;
            border: 1px solid black;
        }

        .item-1 {
            grid-column: 1/3;
            grid-row: 1/3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item-1 item">item</div>
        <div class="item-2 item">item</div>
        <div class="item-3 item">item</div>
        <div class="item-4 item">item</div>
        <div class="item-5 item">item</div>
        <div class="item-6 item">item</div>
        <div class="item-7 item">item</div>
        <div class="item-8 item">item</div>
        <div class="item-9 item">item</div>
    </div>
</body>
</html>
