<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        * {
            margin: 0;
        }

        .box1, .box2 {
            background-color: brown;
            width: 20%;

            margin: 10px;
            padding: 20px; /*applies all the 4 sides as same */
            border: 5px solid black;
        }

        .box1 {
            box-sizing: content-box;
        }

        .box2 {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box1">
        Thulasika
    </div>
    <div class="box2">
        Arunakirinathan
    </div>
</body>
</html>
