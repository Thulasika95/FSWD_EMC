<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-sky-200">
    <header class="bg-blue-600 text-white p-5">
        <h1 class="text-2xl font-bold text-center">Student Dashboard</h1>
    </header>
    <main class="p-6 mx-auto">
        <div class="bg-white p-6 rounded-xl text-center shadow-xl">
            <img src="https://plus.unsplash.com/premium_photo-1688350808212-4e6908a03925?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="GirlPhoto" class="w-24 h-24 rounded-full mx-auto mb-4">
            <h2 class="text-2xl font-bold text-gray-800">Ramya</h2>
            <p>Full Stack Developer</p>
            <button class="bg-blue-600 text-white px-6 py-2 rounded-lg mt-4 hover:bg-blue-800">View Profile</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 mt-8">
            <div class="bg-white p-5 rounded-lg shadow-md hover:shadow-xl">
                <h3 class="text-gray-500">Total Course</h3>
                <p class="text-3xl font-bold text-blue-600 mt-2">5</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-md hover:shadow-xl">
                <h3 class="text-gray-500">Completed</h3>
                <p class="text-3xl font-bold text-blue-600 mt-2">3</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-md hover:shadow-xl">
                <h3 class="text-gray-500">Pending Course</h3>
                <p class="text-3xl font-bold text-blue-600 mt-2">2</p>
            </div>
        </div>

        <section class="bg-white p-6 rounded-lg shawdow-lg mt-8 text-center">
            <h2 class="text-xl font-bold mb-4">My Courses</h2>
            <div class="border-b py-3 flex justify-between">
                <span>HTML & CSS</span>
                <span>Completed</span>
            </div>
            <div class="border-b py-3 flex justify-between">
                <span>React</span>
                <span>Completed</span>
            </div>
            <div class="border-b py-3 flex justify-between">
                <span>Node</span>
                <span>In Progress</span>
            </div>
        </section>
    </main>
    <footer class="bg-gray-800 text-white text-center p-4">
        <p>2026 student dashboard</p>
    </footer>
</body>
</html>
